version: '3.8'
services:
  mongodb:
    image: mongo:6
    container_name: sunmap-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sunmap-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sunmap-backend
    # Map container port 3001 to host port 3002 to avoid conflicts with any
    # process already listening on host:3001. If you prefer host:3001, change
    # the left side to 3001 and ensure no local process is using that port.
    ports:
      - '3002:3001'
    environment:
      MONGO_URI: mongodb://root:123456@mongodb:27017/sunmap?authSource=admin
      JWT_SECRET: supersecret
      DEFAULT_ADMIN_EMAIL: admin@sunmap.com
      DEFAULT_ADMIN_PASSWORD: 123456
      BACKEND_API_KEY: supersecret_api_key
      # OpenWeather API key used by backend `/weather/fetch` endpoint.
      # Configure via a root `.env` file or your environment. Do NOT commit secrets.
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      PORT_FALLBACK: 'true'
    depends_on:
      - mongodb
      - rabbitmq
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:3001/health',res=>{if(res.statusCode>=200&&res.statusCode<500)process.exit(0);else process.exit(1)});req.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sunmap-frontend
    # The frontend Dockerfile builds static assets and serves via nginx on port 80
    ports:
      - '5173:80'
    restart: unless-stopped
    depends_on:
      - backend

  worker-node:
    build: ./worker-node
    container_name: sunmap-worker-node
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      BACKEND_URL: http://backend:3001/api/weather/logs
      WEATHER_QUEUE: weather
    depends_on:
      - backend
      - rabbitmq

  worker-go:
    build: ./worker-go
    container_name: sunmap-worker-go
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      BACKEND_URL: http://backend:3001/api/weather/logs
    depends_on:
      - backend
      - rabbitmq

  producer-py:
    build: ./producer-py
    container_name: sunmap-producer-py
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PUBLISHER_RETRIES: 8
      PUBLISH_COUNT: 1
      PUBLISHER_RETRY_DELAY: 2
    depends_on:
      - rabbitmq

volumes:
  mongo-data:
  rabbitmq-data:
